---
name: CI
'on':
  pull_request:
    paths-ignore:
      - '*.md'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  schedule:
    - cron: "0 9 * * 1"


jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Tinyblargon.cpu_scaling_governor'
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5
        with:
          path: 'Tinyblargon.cpu_scaling_governor'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install ansible-lint
      - name: Log tool info
        run: make info
      - name: Lint code.
        run: ansible-lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v5

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install ansible
      - name: Log tool info
        run: make info
      - name: Run unit test playbook.
        run: make unit_test